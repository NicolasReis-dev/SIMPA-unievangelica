<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPA - Dashboard Executivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; }
        .card { background-color: #1e1e1e; border: 1px solid #333; }
        .sidebar { background-color: #0a0a0a; min-height: 100vh; border-right: 1px solid #333; }
        
        /* O truque do Tech Lead: max-height original (60px) para não empurrar o menu, 
           e scale(1.7) para a logo crescer 70% visualmente! */
        .logo-img { 
            max-height: 60px; 
            object-fit: contain; 
            transform: scale(1.7); 
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar py-4">
                
                <div class="text-center mb-4 px-3">
                    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo SIMPA" class="img-fluid logo-img">
                </div>
                <ul class="nav flex-column px-3 mt-4">
                    <li class="nav-item mb-2"><a class="nav-link text-white fw-bold" href="#">📊 Dashboard</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-secondary" href="#">👥 Alunos (Em breve)</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-secondary" href="#">⚙️ Configurações</a></li>
                </ul>
            </nav>

            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-4 border-bottom border-secondary">
                    <h1 class="h3">Painel da Coordenação</h1>
                    <button class="btn btn-info" onclick="gerarOrientacaoIA()">🧠 Gerar Plano de Ação (IA)</button>
                </div>

                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card p-3 text-center">
                            <h6 class="text-muted">Total de Alunos</h6>
                            <h2 id="total-alunos" class="fw-bold text-white">-</h2>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card p-3 text-center">
                            <h6 class="text-muted">Média Geral</h6>
                            <h2 id="media-geral" class="fw-bold text-success">-</h2>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card p-3 text-center">
                            <h6 class="text-muted">Desvio Padrão</h6>
                            <h2 id="desvio-padrao" class="fw-bold text-warning">-</h2>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card p-3 text-center border-danger">
                            <h6 class="text-danger">Alunos em Risco</h6>
                            <h2 id="alunos-risco" class="fw-bold text-danger">-</h2>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12 mb-4">
                        <div class="card p-4">
                            <h5 class="text-info mb-3">🤖 Orientação Pedagógica Inteligente (Gemini)</h5>
                            <div id="box-ia" class="text-light">
                                <em>Clique no botão azul acima para a inteligência artificial analisar a turma...</em>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        window.onload = function() {
            fetch('/dashboard')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('total-alunos').innerText = data.indicadores_globais['01_total_alunos'];
                    document.getElementById('media-geral').innerText = data.indicadores_globais['02_media_geral_turma'];
                    document.getElementById('desvio-padrao').innerText = data.indicadores_globais['04_desvio_padrao_notas'];
                    document.getElementById('alunos-risco').innerText = data.insights_inteligentes['quantidade_alunos_risco_critico'];
                })
                .catch(error => console.error("Erro ao carregar dashboard:", error));
        };

        function gerarOrientacaoIA() {
            const boxIA = document.getElementById('box-ia');
            boxIA.innerHTML = '<span class="text-warning spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> <span class="text-warning">A inteligência artificial está analisando as notas e escrevendo o plano de ação (isso pode levar até 10 segundos)...</span>';
            
            fetch('/orientacao_ia')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Servidor respondeu com status ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if(data.erro) {
                        boxIA.innerHTML = `<span class="text-danger fw-bold">Erro do Sistema:</span> <span class="text-danger">${data.erro}</span>`;
                    } else {
                        let textoIA = data.orientacao_pedagogica_ia;
                        textoIA = textoIA.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                        textoIA = textoIA.replace(/\n/g, '<br>');
                        boxIA.innerHTML = `<p class="lh-lg">${textoIA}</p>`;
                    }
                })
                .catch(error => {
                    boxIA.innerHTML = `<span class="text-danger fw-bold">Falha na conexão:</span> <span class="text-danger">${error.message}. Verifique o terminal do VS Code.</span>`;
                });
        }
    </script>
</body>
</html>
