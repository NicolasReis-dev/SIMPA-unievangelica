<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPA - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --bg:#121212; --bg2:#1e1e1e; --bg3:#2a2a2a; --border:#2a2a2a; --border2:#333; --text:#fff; --text2:#888; }
        [data-theme="light"] { --bg:#f4f6f9; --bg2:#fff; --bg3:#f0f0f0; --border:#e0e0e0; --border2:#ccc; --text:#111; --text2:#555; }
        body { background: var(--bg); font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 3rem 2.5rem; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
        .simpa-logo { font-size: 2.2rem; font-weight: 800; color: #fff; letter-spacing: 3px; text-align: center; }
        .simpa-logo span { color: #0dcaf0; }
        .form-control { background: var(--bg3); border-color: var(--border2); color: var(--text); padding: 0.75rem 1rem; border-radius: 10px; }
        .form-control:focus { background: var(--bg3); border-color: #0dcaf0; color: var(--text); box-shadow: 0 0 0 3px rgba(13,202,240,0.15); }
        .form-control::placeholder { color: var(--text2); }
        .btn-login { background: #0dcaf0; border: none; color: #000; font-weight: 600; padding: 0.75rem; border-radius: 10px; width: 100%; font-size: 1rem; transition: all 0.2s; }
        .btn-login:hover { background: #0bb5d8; transform: translateY(-1px); }
        .btn-login:active { transform: translateY(0); }
        .error-box { background: #3a0e0a; border: 1px solid #f87171; color: #f87171; border-radius: 10px; padding: 0.75rem 1rem; font-size: 0.85rem; display: none; }
        .theme-toggle { position: fixed; top: 1rem; right: 1rem; background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); border-radius: 20px; padding: 4px 12px; font-size: 0.75rem; cursor: pointer; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="alternarTema()">🌙 Modo Claro</button>

    <div class="login-box">
        <div class="simpa-logo mb-2">SIM<span>PA</span></div>
        <p style="text-align:center; color:var(--text2); font-size:0.8rem; letter-spacing:1px; margin-bottom:2rem">SISTEMA ACADÊMICO</p>

        <div class="mb-3">
            <label style="font-size:0.82rem; color:var(--text2); margin-bottom:6px; display:block">Senha de acesso</label>
            <input type="password" id="campo-senha" class="form-control" placeholder="Digite a senha..." onkeydown="if(event.key==='Enter') fazerLogin()">
        </div>

        <div class="error-box mb-3" id="erro-login">❌ Senha incorreta. Tente novamente.</div>

        <button class="btn-login" onclick="fazerLogin()">Entrar →</button>

        <p style="text-align:center; color:var(--text2); font-size:0.75rem; margin-top:1.5rem">
            Senha padrão: <code style="color:#0dcaf0">simpa2026</code><br>
            <small>Altere no arquivo <code>.env</code> com <code>SIMPA_SENHA=suasenha</code></small>
        </p>
    </div>

<script>
const temaBtn = document.querySelector('.theme-toggle');
function alternarTema() {
    const atual = document.documentElement.getAttribute('data-theme');
    if (atual === 'light') {
        document.documentElement.removeAttribute('data-theme');
        document.documentElement.setAttribute('data-bs-theme', 'dark');
        temaBtn.textContent = '🌙 Modo Claro';
        localStorage.setItem('tema', 'dark');
    } else {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.setAttribute('data-bs-theme', 'light');
        temaBtn.textContent = '☀️ Modo Escuro';
        localStorage.setItem('tema', 'light');
    }
}
if (localStorage.getItem('tema') === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.documentElement.setAttribute('data-bs-theme', 'light');
    temaBtn.textContent = '☀️ Modo Escuro';
}

function fazerLogin() {
    const senha = document.getElementById('campo-senha').value;
    const erro  = document.getElementById('erro-login');
    erro.style.display = 'none';

    fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ senha })
    })
    .then(r => r.json())
    .then(data => {
        if (data.sucesso) {
            window.location.href = '/';
        } else {
            erro.style.display = 'block';
            document.getElementById('campo-senha').value = '';
            document.getElementById('campo-senha').focus();
        }
    })
    .catch(() => { erro.style.display = 'block'; });
}
</script>
</body>
</html>
